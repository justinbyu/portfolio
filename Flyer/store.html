<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hearth Store</title>
  <meta name="theme-color" content="#07090e">
  <meta name="description" content="Temporary example store for the owner. No account number is shown.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="glass-pay">
  <main class="pay-shell">
    <a class="glass-back" href="index.html">← Menu</a>
    <section class="pay-card store-card">
      <img class="store-logo" src="images/logo.png" alt="Hearth logo">
      <p class="pay-kicker">Store owner site</p>
      <h1 id="storeName">Hearth</h1>
      <p class="pay-for">Temporary example store. Order now lands here instead of a payment app. Paste the real https site into <code>storeUrl</code> in menu.js when the owner has one.</p>

      <article class="store-item">
        <p class="pay-kicker">This order</p>
        <h2 id="itemName">Menu item</h2>
        <p id="dealLine" class="pay-kicker" hidden></p>
        <p id="itemPrice" class="store-price">$0</p>
        <label class="add-on" id="addOnLabel" hidden>
          <input id="addOn" type="checkbox">
          <span id="addOnText">Add-on</span>
        </label>
        <label>
          Quantity
          <input id="qty" type="number" min="1" max="20" value="1">
        </label>
        <form class="claim-form" id="claimForm">
          <label for="claimCode">Enter your code</label>
          <div class="claim-row">
            <input id="claimCode" name="code" autocomplete="off" spellcheck="false" maxlength="32" placeholder="Prize code">
            <button type="submit">Claim</button>
          </div>
          <p class="claim-status" id="claimStatus" role="status"></p>
        </form>
      </article>

      <button type="button" class="order-now" id="placeOrder">Place order</button>
      <p class="pay-for" id="orderStatus" role="status"></p>
    </section>
  </main>
  <script src="menu.js"></script>
  <script>
    (function () {
      var client = window.CLIENT || {};
      var params = new URLSearchParams(window.location.search);
      var item = params.get("item") || "Menu item";
      var price = params.get("price") || "Ask";
      var was = params.get("was") || "";
      var promo = params.get("promo") || "";
      var ends = params.get("ends") || "";
      var addOnName = params.get("addOn") || "";
      var addOnPrice = params.get("addOnPrice") || "";
      var name = document.getElementById("storeName");
      var itemName = document.getElementById("itemName");
      var itemPrice = document.getElementById("itemPrice");
      var dealLine = document.getElementById("dealLine");
      var addOnLabel = document.getElementById("addOnLabel");
      var addOnText = document.getElementById("addOnText");
      var addOn = document.getElementById("addOn");
      var status = document.getElementById("orderStatus");
      var button = document.getElementById("placeOrder");
      var qty = document.getElementById("qty");
      var claimForm = document.getElementById("claimForm");
      var claimInput = document.getElementById("claimCode");
      var claimStatus = document.getElementById("claimStatus");
      var marketing = window.MARKETING || {};
      var prizes = marketing.prizes || [];

      function weekNumber(date) {
        var copy = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        var day = copy.getUTCDay() || 7;
        copy.setUTCDate(copy.getUTCDate() + 4 - day);
        var yearStart = new Date(Date.UTC(copy.getUTCFullYear(), 0, 1));
        return Math.ceil((((copy - yearStart) / 86400000) + 1) / 7);
      }

      function weekCode() {
        var prefix = String(marketing.weekPrefix || client.name || "STORE").replace(/\s+/g, "").toUpperCase();
        var n = weekNumber(new Date());
        return prefix + "-W" + (n < 10 ? "0" : "") + n;
      }

      function cleanCode(value) {
        return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      }

      function claimCodeFor(prize) {
        var token = String(prize && prize.code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (!token) return "";
        return weekCode().replace(/-W(\d+)$/, "-" + token + "-W$1");
      }

      function prizeFromCode(value) {
        var typed = cleanCode(value);
        if (!typed) return null;
        for (var i = 0; i < prizes.length; i += 1) {
          if (cleanCode(claimCodeFor(prizes[i])) === typed) return prizes[i];
        }
        return null;
      }

      var claimed = null;
      function setClaimMessage(message, bad) {
        if (!claimStatus) return;
        claimStatus.textContent = message;
        claimStatus.classList.toggle("is-bad", Boolean(bad));
      }
      function applyCode(value) {
        var prize = prizeFromCode(value);
        if (!prize) {
          claimed = null;
          setClaimMessage("That code does not match a prize this week.", true);
          return;
        }
        claimed = { label: prize.label, code: claimCodeFor(prize) };
        setClaimMessage("Prize claimed: " + prize.label + ".");
      }

      var fromOrder = params.get("claim") || "";
      if (claimInput && fromOrder) claimInput.value = fromOrder;
      if (fromOrder && prizeFromCode(fromOrder)) applyCode(fromOrder);

      if (name && client.name) name.textContent = client.name;
      if (itemName) itemName.textContent = item;
      if (itemPrice) itemPrice.textContent = was ? price + "  ·  was " + was : price;
      if (dealLine && promo) {
        dealLine.hidden = false;
        dealLine.textContent = [promo, ends].filter(Boolean).join(" · ");
      }
      if (addOnLabel && addOnName) {
        addOnLabel.hidden = false;
        if (addOnText) addOnText.textContent = addOnName + (addOnPrice ? " · " + addOnPrice : "");
      }

      if (claimForm) {
        claimForm.addEventListener("submit", function (event) {
          event.preventDefault();
          applyCode(claimInput && claimInput.value);
        });
      }

      if (button) {
        button.addEventListener("click", function () {
          var count = Math.max(1, Number(qty && qty.value) || 1);
          var extra = addOn && addOn.checked ? " + " + addOnName : "";
          var prizeNote = claimed ? " Prize: " + claimed.label + " (" + claimed.code + ")." : "";
          if (status) {
            status.textContent = "Example only. " + count + " × " + item + extra + " (" + price + ") is noted on this temporary store." + prizeNote + " No account number is shown, and nothing was charged.";
          }
        });
      }
    })();
  </script>
</body>
</html>
