
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TapAsul | Client ID</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090D18;
      color: #F7F9FC;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 420px);
      padding: 36px 24px;
      text-align: center;
      background: #111827;
      border: 1px solid #2B3A52;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 8px;
      color: #61BDFF;
    }

    p {
      color: #9BA9BE;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      color: white;
      background: #090D18;
      border: 1px solid #2B3A52;
    }

    button {
      border: none;
      background: #1766A8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2186D5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>TapAsul</h1>
    <p>Tap. Connect. Grow.</p>

    <h2>Enter your Client ID</h2>

    <form id="client-form">
      <input
        id="client-id"
        type="text"
        placeholder="Enter Client ID"
        maxlength="32"
        pattern="[A-Za-z0-9_-]+"
        aria-label="Client ID"
        required
      >
      <button type="submit">Continue</button>
    </form>
  </main>

  <script>
    document.getElementById("client-form").addEventListener("submit", (event) => {
      event.preventDefault();

      const id = document.getElementById("client-id").value.trim();

      if (!/^[A-Za-z0-9_-]{1,32}$/.test(id)) {
        alert("Please enter a valid Client ID.");
        return;
      }

      alert("Your Client ID is " + id + ". We will connect the redirect system next.");
    });
  </script>
</body>
</html>
