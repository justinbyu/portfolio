<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Arcega - Digital Business Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Fluid Gradient Background -->
    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>
    </div>

    <!-- Main Mobile Frame Container -->
    <div class="app-container">
        
        <!-- Header Controls (Updated with Affiliate Marketing Tagline) -->
        <div class="glass-card nav-header">
            <span class="nav-tag"><i class="fa-solid fa-sparkles"></i> DIGITAL CARD</span>
            <span class="header-tagline"><i class="fa-solid fa-chart-line"></i> Affiliate Marketing Creator</span>
        </div>

        <!-- Profile Hero Card -->
        <div class="glass-card hero-card">
            <div class="profile-wrapper">
                <img src="images/profile.png" alt="King Arcega Profile" class="profile-img">
                <div class="badge-verified"><i class="fa-solid fa-check"></i></div>
            </div>
            
            <h1 class="user-name">King Arcega</h1>
            <span class="user-business">theshop101.ph</span>
            
            <p class="user-location">
                <i class="fa-solid fa-location-dot" style="color: #FF2D55;"></i>
                55 G Marcelo Street Maysan Valenzuela City
            </p>

            <div class="cta-grid">
                <button class="btn-primary" onclick="downloadVCard()">
                    <i class="fa-solid fa-address-card"></i> Save to Contacts
                </button>
                <a href="mailto:theshop101.ph@gmail.com" class="btn-secondary">
                    <i class="fa-solid fa-envelope"></i> Email
                </a>
                <a href="https://maps.google.com/?q=55+G+Marcelo+Street+Maysan+Valenzuela+City" target="_blank" class="btn-secondary">
                    <i class="fa-solid fa-map-pin"></i> Directions
                </a>
            </div>
        </div>

        <!-- Social Media Section Title -->
        <div class="section-title">Connect & Socials</div>

        <!-- Social Links Widget -->
        <div class="widget-group">
            
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@theshop101ph?_r=1&_t=ZS-9AtWSfJWu8q" target="_blank" class="social-link-item">
                <div class="link-left">
                    <div class="link-icon tiktok-bg">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <div class="link-info">
                        <span class="link-title">TikTok</span>
                        <span class="link-sub">@theshop101ph</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1Cko11JjHw/?mibextid=wwXIfr" target="_blank" class="social-link-item">
                <div class="link-left">
                    <div class="link-icon fb-bg">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <div class="link-info">
                        <span class="link-title">Facebook</span>
                        <span class="link-sub">theshop101.ph</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.facebook.com/share/1Cko11JjHw/?mibextid=wwXIfr" target="_blank" class="social-link-item">
                <div class="link-left">
                    <div class="link-icon insta-bg">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="link-info">
                        <span class="link-title">Instagram</span>
                        <span class="link-sub">theshop101.ph</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- Email Direct -->
            <a href="mailto:theshop101.ph@gmail.com" class="social-link-item">
                <div class="link-left">
                    <div class="link-icon email-bg">
                        <i class="fa-solid fa-paper-plane"></i>
                    </div>
                    <div class="link-info">
                        <span class="link-title">Email Us</span>
                        <span class="link-sub">theshop101.ph@gmail.com</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

        </div>

        <div class="footer-tag">Powered by TapAsul • Digital Business Card</div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
