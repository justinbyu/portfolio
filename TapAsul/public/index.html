<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="Enter your TapAsul Client ID to open your digital business card.">
  <title>TapAsul — Tap. Connect. Grow.</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="card" aria-labelledby="page-title">
      <a class="brand" href="/" aria-label="TapAsul home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-word">Tap<span>Asul</span></span>
      </a>
      <p class="tagline">Tap. Connect. Grow.</p>
      <div class="accent-line" aria-hidden="true"></div>
      <h1 id="page-title">Your connections<br>start here.</h1>
      <p class="intro">Enter your Client ID to open your digital business card.</p>
      <form id="client-form" action="/r/" method="get" novalidate>
        <label for="client-id">Client ID</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">#</span>
          <input id="client-id" name="id" type="text" placeholder="Enter Client ID" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="32" required aria-describedby="id-help form-error">
        </div>
        <p class="field-help" id="id-help">Use the ID printed on your TapAsul card.</p>
        <p class="error-message" id="form-error" role="alert" aria-live="polite"></p>
        <button id="continue-button" type="submit"><span>Continue</span><span class="arrow" aria-hidden="true">→</span></button>
      </form>
      <p class="secure-note"><span class="lock-icon" aria-hidden="true">◆</span> Secure connection to your card</p>
    </section>
    <footer>© <span id="year">2026</span> TapAsul <span class="dot">·</span> Tap. Connect. Grow.</footer>
  </main>
</body>
</html>
